[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupfinder"
version = "0.3.0"
description = "Finds duplicate files by content, including inside ZIP, 7z and RAR archives"
requires-python = ">=3.8"

[project.optional-dependencies]
trash = ["send2trash"]
app = ["pywebview"]                      # desktop window instead of the browser
images = ["Pillow"]                      # similar images and thumbnails
all = ["send2trash", "pywebview", "Pillow"]

[project.scripts]
dupfinder = "dupfinder.__main__:main"

[tool.setuptools]
packages = ["dupfinder"]

[tool.setuptools.package-data]
# build of frontend/ (python start.py): must be built before creating the package
dupfinder = ["web/*", "web/assets/*"]
