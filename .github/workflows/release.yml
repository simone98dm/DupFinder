# Releases driven by Conventional Commits (release-please):
# 1. every merge to main updates the "Release PR" (CHANGELOG.md + version in pyproject.toml and package.json);
# 2. merging that PR creates the tag and the GitHub release, then the jobs below build Windows and macOS and attach them.
# Run it by hand (Actions tab) to only get the build artifacts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview Pillow send2trash

      - name: Tests
        run: python -m unittest -v

      # macOS: --onedir, because PyInstaller does not support one-file .app bundles
      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: python build_app.py
      - name: Build (macOS)
        if: matrix.name == 'macos'
        run: python build_app.py --onedir

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DupFinder.exe -DestinationPath DupFinder-windows.zip
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent dist/DupFinder.app DupFinder-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DupFinder-${{ matrix.name }}
          path: DupFinder-${{ matrix.name }}.zip

      - name: Attach to the release
        if: needs.release-please.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" DupFinder-${{ matrix.name }}.zip --clobber
