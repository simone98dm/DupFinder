# Builds the desktop app for Windows and macOS.
# Push a tag like v0.2.0 to publish a GitHub release; run it by hand (Actions tab) to only get the build artifacts.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview Pillow send2trash

      - name: Tests
        run: python -m unittest -v

      # macOS: --onedir, because PyInstaller does not support one-file .app bundles
      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: python build_app.py
      - name: Build (macOS)
        if: matrix.name == 'macos'
        run: python build_app.py --onedir

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DupFinder.exe -DestinationPath DupFinder-windows.zip
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent dist/DupFinder.app DupFinder-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DupFinder-${{ matrix.name }}
          path: DupFinder-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DupFinder-*.zip --repo "$GITHUB_REPOSITORY" --title "DupFinder $GITHUB_REF_NAME" --generate-notes
